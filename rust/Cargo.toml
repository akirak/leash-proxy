[package]
name = "leash-proxy"
version = "0.1.0"
edition = "2024"
description = "Policy-enforcing egress proxy for AI agents: MITM/forward proxying with Cedar policies and structured audit logging"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1"
cedar-policy = "4"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
openssl = "0.10"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server-auto", "tokio"] }
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
x509-parser = "0.16"
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
