name: Documentation

on:
  push:
    branches: [master]
    paths: [".github/workflows/docs.yml", "docs/user/**"]
  pull_request:
    paths: [".github/workflows/docs.yml", "docs/user/**"]

concurrency:
  # Deployments must not be cancelled mid-flight, so the group only
  # deduplicates builds; the deploy job uses its own serialization via
  # the `github-pages` environment.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: docs/user

jobs:
  build:
    name: Build user documentation
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup@v6.1.0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: "10"

      # actions/setup-node@v7.1.0
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/user/pnpm-lock.yaml

      - name: Fetch dependencies
        run: pnpm install --frozen-lockfile

      # actions/configure-pages@v6.0.0
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build site
        run: pnpm run build

      # actions/upload-pages-artifact@v5.0.0
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/user/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v5.0.1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
